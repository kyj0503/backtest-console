name: backtest-console-dev
services:
  console:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      VITE_API_BASE_URL: ""
      FASTAPI_PROXY_TARGET: http://host.docker.internal:8000
    command: [sh, -c, 'npm ci --no-audit --no-fund && npm run dev']
    restart: unless-stopped
volumes:
  node_modules:
