name: backtest-console-${APP_ENV:?}

services:
  app:
    image: ${APP_IMAGE:?}
    container_name: ${APP_CONTAINER:?}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      BACKTEST_API_UPSTREAM: ${APP_BACKEND:?}
    networks:
      - backend-net
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost/health']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

networks:
  backend-net:
    external: true
